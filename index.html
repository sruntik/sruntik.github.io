<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>sruntik.github.io · repository index</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #faf9fc;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      line-height: 1.5;
      color: #1e1e2f;
      padding: 2rem 1rem;
      min-height: 100vh;
    }

    .repo-container {
      max-width: 1100px;
      margin: 0 auto;
      background: #fff;
      border-radius: 28px;
      box-shadow: 0 12px 28px rgba(0,0,0,.06), 0 4px 10px rgba(0,0,0,.02);
      padding: 2rem 2rem 2.5rem;
      border: 1px solid #e9e9ef;
    }

    .repo-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: .75rem 1.25rem;
      margin-bottom: 1.75rem;
      border-bottom: 1px solid #e2e2ea;
      padding-bottom: 1.5rem;
    }

    .repo-header h1 {
      font-size: 1.9rem;
      font-weight: 600;
      letter-spacing: -.01em;
      display: flex;
      align-items: center;
      gap: .6rem;
      color: #111;
      word-break: break-word;
    }

    .repo-header h1 i { color: #2b6f9b; font-size: 1.8rem; }

    .repo-meta {
      display: flex;
      flex-wrap: wrap;
      gap: .75rem 1.5rem;
      margin-left: auto;
      font-size: .95rem;
    }

    .repo-meta a {
      color: #2b6f9b;
      text-decoration: none;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: .35rem;
      border-radius: 12px;
      padding: .2rem .5rem;
      transition: background .15s ease;
    }

    .repo-meta a:hover, .repo-meta a:focus-visible {
      background: #eef4f8;
      outline: 2px solid #2b6f9b;
      outline-offset: 2px;
    }

    .branch-info {
      background: #f4f6fa;
      border-radius: 40px;
      padding: .4rem 1rem;
      font-size: .9rem;
      display: inline-flex;
      align-items: center;
      gap: .6rem;
      margin-bottom: 1.6rem;
      color: #1d2b3f;
      border: 1px solid #dee4ed;
      font-weight: 500;
    }

    .branch-info i { color: #2b6f9b; }

    .status-region {
      border-radius: 18px;
      padding: 1rem 1.25rem;
      margin-bottom: 1.4rem;
      font-size: 1rem;
      display: flex;
      align-items: center;
      gap: .75rem;
    }

    .status-loading { background: #eef4f8; color: #1d3b5c; border-left: 5px solid #2b6f9b; }
    .status-error   { background: #fff2f0; color: #a12b2b; border-left: 5px solid #c53b3b; }
    .status-info    { background: #f3f9f3; color: #1f5e2f; border-left: 5px solid #2e7d32; }

    .files-table {
      width: 100%;
      border-collapse: collapse;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,.02);
      table-layout: fixed;
    }

    .files-table th {
      text-align: left;
      background: #f2f4fa;
      padding: .9rem 1rem;
      font-weight: 600;
      font-size: .8rem;
      letter-spacing: .04em;
      text-transform: uppercase;
      color: #2d3f5e;
      border-bottom: 1px solid #d9dee9;
    }

    .files-table th:nth-child(1) { width: 32%; }
    .files-table th:nth-child(2) { width: 48%; }
    .files-table th:nth-child(3) { width: 12%; }
    .files-table th:nth-child(4) { width: 8%; }

    .files-table td {
      padding: .9rem 1rem;
      border-bottom: 1px solid #ecedf2;
      vertical-align: middle;
      background: #fff;
      word-break: break-all;
      font-size: .92rem;
    }

    .files-table tr:last-child td { border-bottom: none; }
    .files-table tr:hover td { background: #fafbff; }

    .file-name {
      display: flex;
      align-items: center;
      gap: .75rem;
      font-weight: 500;
    }

    .file-name i { width: 1.4rem; font-size: 1.1rem; text-align: center; color: #2b6f9b; flex-shrink: 0; }

    .file-link {
      color: #1d3b5c;
      text-decoration: none;
      border-radius: 6px;
      padding: .2rem .4rem;
      margin: -.2rem -.4rem;
      transition: background .15s, color .15s;
      word-break: break-word;
    }

    .file-link:hover, .file-link:focus-visible {
      background: #e1ecf5;
      color: #0e2a44;
      outline: 2px solid #2b6f9b;
      outline-offset: 2px;
    }

    .live-url {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: .82rem;
      color: #2b6f9b;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: .4rem;
      padding: .25rem .5rem;
      border-radius: 8px;
      background: #f2f7fb;
      border: 1px solid #dce7f1;
      transition: background .15s, border-color .15s;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .live-url:hover, .live-url:focus-visible {
      background: #e1ecf5;
      border-color: #2b6f9b;
      outline: 2px solid #2b6f9b;
      outline-offset: 2px;
    }

    .live-url i { font-size: .75rem; color: #4b7fa8; flex-shrink: 0; }

    .live-url.unavailable {
      color: #8a8a99;
      background: #f4f4f7;
      border-color: #e2e2ea;
      cursor: not-allowed;
    }

    .file-size {
      color: #4d5d73;
      font-size: .85rem;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .actions {
      text-align: right;
    }

    .actions a {
      color: #2b6f9b;
      text-decoration: none;
      font-size: .82rem;
      font-weight: 500;
      padding: .25rem .55rem;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      gap: .3rem;
      transition: background .15s;
      white-space: nowrap;
    }

    .actions a:hover, .actions a:focus-visible {
      background: #eef4f8;
      outline: 2px solid #2b6f9b;
      outline-offset: 2px;
    }

    .badge-dir {
      background: #e3e9f3;
      color: #1d3b5c;
      font-size: .65rem;
      font-weight: 600;
      padding: .15rem .5rem;
      border-radius: 30px;
      letter-spacing: .03em;
      text-transform: uppercase;
      margin-left: .4rem;
      vertical-align: middle;
    }

    .footnote {
      margin-top: 1.8rem;
      text-align: center;
      font-size: .8rem;
      color: #6b6b80;
      border-top: 1px solid #e2e2ea;
      padding-top: 1.5rem;
    }

    .footnote code {
      background: #f2f4fa;
      padding: .1rem .4rem;
      border-radius: 4px;
      font-size: .78rem;
      color: #1d3b5c;
    }

    @media (max-width: 720px) {
      body { padding: 1rem .5rem; }
      .repo-container { padding: 1.5rem 1rem; border-radius: 20px; }
      .repo-header h1 { font-size: 1.5rem; }
      .repo-meta { margin-left: 0; width: 100%; }
      .files-table th, .files-table td { padding: .7rem .5rem; font-size: .85rem; }
      .files-table th:nth-child(1) { width: 40%; }
      .files-table th:nth-child(2) { width: 40%; }
      .files-table th:nth-child(3) { width: 12%; }
      .files-table th:nth-child(4) { width: 8%; }
      .live-url { font-size: .72rem; }
    }

    a:focus-visible, button:focus-visible { outline: 3px solid #2b6f9b; outline-offset: 2px; }
  </style>
</head>
<body>
  <div class="repo-container">
    <div class="repo-header">
      <h1><i class="fas fa-code-branch" aria-hidden="true"></i> sruntik.github.io</h1>
      <div class="repo-meta">
        <a href="https://github.com/sruntik/sruntik.github.io" target="_blank" rel="noopener noreferrer">
          <i class="fab fa-github" aria-hidden="true"></i> Source
        </a>
        <a href="https://sruntik.github.io" target="_blank" rel="noopener noreferrer">
          <i class="fas fa-globe" aria-hidden="true"></i> Home
        </a>
      </div>
    </div>

    <div class="branch-info">
      <i class="fas fa-code-branch" aria-hidden="true"></i>
      <span>branch: <strong>main</strong> · served at <strong>sruntik.github.io</strong></span>
    </div>

    <div id="statusMessage" class="status-region status-loading" role="status" aria-live="polite">
      <i class="fas fa-spinner fa-pulse" aria-hidden="true"></i>
      <span>Fetching repository contents…</span>
    </div>

    <table class="files-table" id="fileTable">
      <caption class="sr-only">Repository contents with live URLs and source links</caption>
      <thead>
        <tr>
          <th scope="col">Name</th>
          <th scope="col">Live URL (sruntik.github.io)</th>
          <th scope="col">Size</th>
          <th scope="col">Source</th>
        </tr>
      </thead>
      <tbody id="fileTableBody"></tbody>
    </table>

    <div class="footnote">
      <i class="fas fa-link" aria-hidden="true"></i>
      Click a <strong>name</strong> or <strong>URL</strong> to open the live page ·
      <code>source</code> opens it on GitHub
    </div>
  </div>

  <script>
    (function () {
      const OWNER = 'sruntik';
      const REPO  = 'sruntik.github.io';
      const BRANCH = 'main';
      const PAGES_BASE = `https://${OWNER}.github.io`; // https://sruntik.github.io
      const API_URL = `https://api.github.com/repos/${OWNER}/${REPO}/contents/?ref=${BRANCH}`;

      const statusDiv = document.getElementById('statusMessage');
      const tableBody = document.getElementById('fileTableBody');

      // ---------- helpers ----------
      function formatSize(bytes) {
        if (!bytes && bytes !== 0) return '—';
        if (bytes < 1024) return bytes + ' B';
        if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
        return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
      }

      function getIcon(item) {
        const n = item.name.toLowerCase();
        if (item.type === 'dir') return 'fas fa-folder';
        if (n === 'index.html') return 'fas fa-home';
        if (n.endsWith('.html') || n.endsWith('.htm')) return 'fas fa-html5';
        if (n.endsWith('.css')) return 'fab fa-css3-alt';
        if (n.endsWith('.js')) return 'fab fa-js';
        if (n.endsWith('.json')) return 'fas fa-code';
        if (n.endsWith('.md') || n.endsWith('.txt')) return 'fas fa-file-alt';
        if (/\.(png|jpe?g|gif|svg|webp|ico|bmp)$/.test(n)) return 'fas fa-image';
        if (n.endsWith('.py')) return 'fab fa-python';
        if (n.endsWith('.java')) return 'fab fa-java';
        if (/\.(zip|tar|gz|rar|7z)$/.test(n)) return 'fas fa-file-archive';
        if (n.endsWith('.pdf')) return 'fas fa-file-pdf';
        if (/\.(ya?ml)$/.test(n)) return 'fas fa-file-code';
        if (n === 'cname' || n === '.nojekyll' || n.startsWith('.')) return 'fas fa-cog';
        return 'fas fa-file';
      }

      // Build the live URL on sruntik.github.io for any item in the repo.
      // - root index.html → https://sruntik.github.io/
      // - other html files → https://sruntik.github.io/name.html
      // - directories     → https://sruntik.github.io/dir/
      // - other files     → https://sruntik.github.io/path/to/file.ext
      function getLiveUrl(item) {
        const path = item.path; // e.g. "about.html" or "blog/index.html"

        // Special case: root index.html → site root
        if (path === 'index.html') return PAGES_BASE + '/';

        if (item.type === 'dir') {
          // GitHub Pages serves folder index.html at /folder/
          return `${PAGES_BASE}/${encodeURI(path)}/`;
        }

        // Regular file — note: only HTML files are actually renderable,
        // but other files (CSS, JS, images, PDFs) are also served and downloadable.
        return `${PAGES_BASE}/${encodeURI(path)}`;
      }

      // Is this item directly viewable in a browser as a page?
      // (HTML files, folders → yes. Everything else → yes but as a download/asset.)
      function isRenderable(item) {
        if (item.type === 'dir') return true;
        const n = item.name.toLowerCase();
        return n.endsWith('.html') || n.endsWith('.htm');
      }

      function getSourceUrl(item) {
        if (item.type === 'dir') {
          return `https://github.com/${OWNER}/${REPO}/tree/${BRANCH}/${item.path}`;
        }
        return `https://github.com/${OWNER}/${REPO}/blob/${BRANCH}/${item.path}`;
      }

      // ---------- status ----------
      function setStatus(type, message) {
        statusDiv.className = `status-region status-${type}`;
        const icons = {
          loading: 'fas fa-spinner fa-pulse',
          error:   'fas fa-exclamation-triangle',
          info:    'fas fa-check-circle'
        };
        statusDiv.innerHTML = `<i class="${icons[type] || ''}" aria-hidden="true"></i> <span>${message}</span>`;
      }

      // ---------- render ----------
      function renderFiles(items) {
        tableBody.innerHTML = '';

        if (!items || items.length === 0) {
          const row = document.createElement('tr');
          const cell = document.createElement('td');
          cell.colSpan = 4;
          cell.style.textAlign = 'center';
          cell.style.padding = '2rem';
          cell.style.color = '#4a4a60';
          cell.innerHTML = '<i class="fas fa-folder-open" style="margin-right:8px;"></i> This repository appears to be empty.';
          row.appendChild(cell);
          tableBody.appendChild(row);
          return;
        }

        // Sort: directories first, index.html first among files, then alphabetical
        const sorted = [...items].sort((a, b) => {
          if (a.type === 'dir' && b.type !== 'dir') return -1;
          if (a.type !== 'dir' && b.type === 'dir') return 1;
          if (a.name.toLowerCase() === 'index.html') return -1;
          if (b.name.toLowerCase() === 'index.html') return 1;
          return a.name.localeCompare(b.name, undefined, { sensitivity: 'base' });
        });

        for (const item of sorted) {
          const tr = document.createElement('tr');
          const liveUrl = getLiveUrl(item);
          const sourceUrl = getSourceUrl(item);
          const renderable = isRenderable(item);

          // --- NAME COLUMN (link to live URL) ---
          const nameTd = document.createElement('td');
          const nameWrap = document.createElement('div');
          nameWrap.className = 'file-name';

          const icon = document.createElement('i');
          icon.className = getIcon(item);
          icon.setAttribute('aria-hidden', 'true');

          const nameLink = document.createElement('a');
          nameLink.href = liveUrl;
          nameLink.className = 'file-link';
          nameLink.target = '_blank';
          nameLink.rel = 'noopener noreferrer';
          nameLink.textContent = item.name;

          const a11yLabel = item.type === 'dir'
            ? `Open folder ${item.name}`
            : `Open ${item.name} on the live site`;
          nameLink.setAttribute('aria-label', a11yLabel);

          nameWrap.appendChild(icon);
          nameWrap.appendChild(nameLink);

          if (item.type === 'dir') {
            const badge = document.createElement('span');
            badge.className = 'badge-dir';
            badge.textContent = 'dir';
            nameWrap.appendChild(badge);
          }

          nameTd.appendChild(nameWrap);

          // --- LIVE URL COLUMN ---
          const urlTd = document.createElement('td');
          const urlLink = document.createElement('a');
          urlLink.href = liveUrl;
          urlLink.target = '_blank';
          urlLink.rel = 'noopener noreferrer';
          urlLink.className = 'live-url';
          urlLink.title = liveUrl;

          // Show a short display version of the URL
          let displayUrl = liveUrl.replace(/^https?:\/\//, '');
          urlLink.innerHTML = `<i class="fas fa-external-link-alt" aria-hidden="true"></i><span>${displayUrl}</span>`;
          urlLink.setAttribute('aria-label', `Open live URL: ${liveUrl}`);

          urlTd.appendChild(urlLink);

          // --- SIZE COLUMN ---
          const sizeTd = document.createElement('td');
          sizeTd.className = 'file-size';
          sizeTd.textContent = item.type === 'dir' ? '—' : formatSize(item.size);

          // --- SOURCE COLUMN ---
          const actionsTd = document.createElement('td');
          actionsTd.className = 'actions';
          const sourceLink = document.createElement('a');
          sourceLink.href = sourceUrl;
          sourceLink.target = '_blank';
          sourceLink.rel = 'noopener noreferrer';
          sourceLink.innerHTML = '<i class="fas fa-code" aria-hidden="true"></i> source';
          sourceLink.setAttribute('aria-label', `View source of ${item.name} on GitHub`);
          actionsTd.appendChild(sourceLink);

          tr.appendChild(nameTd);
          tr.appendChild(urlTd);
          tr.appendChild(sizeTd);
          tr.appendChild(actionsTd);
          tableBody.appendChild(tr);
        }
      }

      // ---------- fetch ----------
      async function fetchRepoContents() {
        setStatus('loading', 'Fetching repository contents…');

        try {
          const response = await fetch(API_URL, {
            headers: { 'Accept': 'application/vnd.github.v3+json' }
          });

          if (!response.ok) {
            if (response.status === 404) {
              throw new Error('Repository or branch not found. Check the repo name and branch.');
            } else if (response.status === 403) {
              throw new Error('GitHub API rate limit exceeded. Try again later.');
            } else {
              throw new Error(`GitHub API responded with status ${response.status}`);
            }
          }

          const data = await response.json();

          if (!Array.isArray(data)) {
            throw new Error('Unexpected API response: expected a list of files.');
          }

          renderFiles(data);

          const n = data.length;
          if (n === 0) {
            setStatus('info', 'Repository is empty.');
          } else {
            setStatus('info', `Loaded ${n} item${n !== 1 ? 's' : ''} · all links point to ${PAGES_BASE}`);
          }
        } catch (err) {
          console.error('Error fetching repo:', err);
          setStatus('error', `Could not load repository: ${err.message}`);

          tableBody.innerHTML = '';
          const row = document.createElement('tr');
          const cell = document.createElement('td');
          cell.colSpan = 4;
          cell.style.textAlign = 'center';
          cell.style.padding = '2rem';
          cell.style.color = '#a12b2b';
          cell.innerHTML = `<i class="fas fa-exclamation-circle" style="margin-right:8px;"></i> ${err.message}`;
          row.appendChild(cell);
          tableBody.appendChild(row);
        }
      }

      window.addEventListener('DOMContentLoaded', fetchRepoContents);
    })();
  </script>
</body>
</html>
